<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Guessing Game</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #f0f4f8;
        }

        .game {
            width: 90%;
            max-width: 400px;
            padding: 30px;
            text-align: center;
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
        }

        h1 {
            margin-top: 0;
        }

        p {
            color: #555;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 15px 0;
            font-size: 18px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #007bff;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        #message {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
        }

        #attempts {
            margin-top: 10px;
            color: #555;
        }

        #restartBtn {
            display: none;
            margin-top: 10px;
            background: #28a745;
        }

        #restartBtn:hover {
            background: #1e7e34;
        }
    </style>
</head>

<body>

    <div class="game">

        <h1>🎯 Number Guessing Game</h1>

        <p>
            I have selected a number between <b>1 and 100</b>.
            Can you guess it?
        </p>

        <input
            type="number"
            id="guessInput"
            placeholder="Enter your guess"
            min="1"
            max="100"
        >

        <button onclick="checkGuess()">Guess</button>

        <div id="message"></div>

        <div id="attempts">
            Attempts: 0
        </div>

        <button id="restartBtn" onclick="restartGame()">
            🔄 Play Again
        </button>

    </div>


    <script>

        // Computer randomly selects a number between 1 and 100
        let secretNumber = Math.floor(Math.random() * 100) + 1;

        // Attempts counter
        let attempts = 0;


        function checkGuess() {

            let guess = Number(
                document.getElementById("guessInput").value
            );

            let message = document.getElementById("message");

            // Check if user entered a valid number
            if (guess < 1 || guess > 100 || isNaN(guess)) {

                message.innerText =
                    "⚠️ Please enter a number between 1 and 100.";

                return;
            }


            // Increase attempts
            attempts++;

            document.getElementById("attempts").innerText =
                "Attempts: " + attempts;


            // Check the guess
            if (guess === secretNumber) {

                message.innerText =
                    "🎉 Congratulations! You guessed the correct number!";

                document.getElementById("restartBtn").style.display =
                    "block";

                document.getElementById("guessInput").disabled =
                    true;

            }

            else if (guess < secretNumber) {

                message.innerText =
                    "📈 Too low! Try a higher number.";

            }

            else {

                message.innerText =
                    "📉 Too high! Try a lower number.";

            }

        }


        function restartGame() {

            // Generate a new random number
            secretNumber = Math.floor(Math.random() * 100) + 1;

            // Reset attempts
            attempts = 0;

            // Reset input
            document.getElementById("guessInput").value = "";

            document.getElementById("guessInput").disabled =
                false;

            // Reset message
            document.getElementById("message").innerText = "";

            // Reset attempts text
            document.getElementById("attempts").innerText =
                "Attempts: 0";

            // Hide restart button
            document.getElementById("restartBtn").style.display =
                "none";
        }

    </script>

</body>
</html>
